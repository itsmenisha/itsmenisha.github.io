<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width,initial-scale=1.0" />

    <title>Highway Rush</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        overflow: hidden;
        font-family: Inter, sans-serif;
        background: #111827;
        color: white;
      }

      canvas {
        display: block;
      }

      .hud {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        padding: 14px 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 10;
        flex-wrap: wrap;
        gap: 10px;
      }

      .title {
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 2px;
      }

      .stats {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .box {
        background: rgba(255, 255, 255, 0.08);
        padding: 10px 14px;
        border-radius: 14px;
        backdrop-filter: blur(8px);
        font-weight: 700;
      }

      .controls {
        position: fixed;
        bottom: 20px;
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 24px;
        z-index: 20;
      }

      .touch-btn {
        width: 95px;
        height: 95px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(255, 255, 255, 0.1);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 38px;
        font-weight: 900;
        backdrop-filter: blur(10px);
      }

      .touch-btn:active {
        transform: scale(0.9);
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.88);
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        z-index: 100;
        padding: 20px;
      }

      .overlay h1 {
        font-size: 64px;
        font-weight: 900;
        margin-bottom: 12px;
      }

      .overlay p {
        opacity: 0.8;
        margin-bottom: 22px;
      }

      .start-btn {
        padding: 16px 30px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(45deg, #ff512f, #dd2476);
        color: white;
        font-size: 18px;
        font-weight: 900;
        cursor: pointer;
      }

      .hint {
        margin-top: 18px;
        opacity: 0.7;
        text-align: center;
        font-size: 14px;
      }

      .skins {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 20px;
      }

      .skin {
        width: 110px;
        height: 110px;
        border-radius: 18px;
        cursor: pointer;
        border: 3px solid transparent;
        background: rgba(255, 255, 255, 0.06);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
        gap: 10px;
      }

      .skin span {
        font-size: 12px;
        font-weight: 700;
      }

      .skin:hover {
        transform: translateY(-4px);
      }

      .skin.active {
        border-color: white;
        transform: scale(1.08);
      }

      .mini-car {
        width: 42px;
        height: 70px;
        border-radius: 14px;
        position: relative;
      }

      .mini-car::before {
        content: "";
        position: absolute;
        width: 28px;
        height: 24px;
        border-radius: 8px;
        background: #87ceeb;
        left: 7px;
        top: 12px;
      }

      .red-car {
        background: linear-gradient(45deg, #ff1744, #ff5252);
      }

      .blue-car {
        background: linear-gradient(45deg, #2979ff, #00b0ff);
      }

      .green-car {
        background: linear-gradient(45deg, #00c853, #64dd17);
      }

      .gold-car {
        background: linear-gradient(45deg, #ffb300, #ffd600);
      }

      .purple-car {
        background: linear-gradient(45deg, #7c4dff, #e040fb);
      }

      @media (min-width: 900px) {
        .controls {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="hud">
      <div class="title">HIGHWAY RUSH</div>

      <div class="stats">
        <div class="box">
          Score:
          <span id="score">0</span>
        </div>

        <div class="box">
          High:
          <span id="high">0</span>
        </div>

        <div class="box">
          Level:
          <span id="level">1</span>
        </div>

        <div class="box">
          Speed:
          <span id="speed">1x</span>
        </div>
      </div>
    </div>

    <canvas id="game"></canvas>

    <!-- MOBILE CONTROLS -->
    <div class="controls">
      <div class="touch-btn" id="leftBtn">◀</div>

      <div class="touch-btn" id="rightBtn">▶</div>
    </div>

    <!-- START SCREEN -->
    <div class="overlay" id="overlay">
      <h1>HIGHWAY RUSH</h1>

      <p>Choose Your Car</p>

      <div class="skins">
        <div class="skin active" data-color="#ff1744">
          <div class="mini-car red-car"></div>

          <span>RED</span>
        </div>

        <div class="skin" data-color="#2979ff">
          <div class="mini-car blue-car"></div>

          <span>BLUE</span>
        </div>

        <div class="skin" data-color="#00c853">
          <div class="mini-car green-car"></div>

          <span>GREEN</span>
        </div>

        <div class="skin" data-color="#ffb300">
          <div class="mini-car gold-car"></div>

          <span>GOLD</span>
        </div>

        <div class="skin" data-color="#aa00ff">
          <div class="mini-car purple-car"></div>

          <span>PURPLE</span>
        </div>
      </div>

      <button class="start-btn" onclick="startGame()">START GAME</button>

      <div class="hint">
        Keyboard: A D or ← →<br />
        Mobile: Tap buttons or screen sides
      </div>
    </div>

    <script>
      const canvas = document.getElementById("game");

      const ctx = canvas.getContext("2d");

      const scoreEl = document.getElementById("score");

      const levelEl = document.getElementById("level");

      const speedEl = document.getElementById("speed");

      const highEl = document.getElementById("high");

      const overlay = document.getElementById("overlay");

      // HIGH SCORE API
      class HighScoreAPI {
        constructor() {
          this.key = "highwayRushHighScore";
        }

        getHighScore() {
          return Number(localStorage.getItem(this.key)) || 0;
        }

        saveScore(score) {
          const current = this.getHighScore();

          if (score > current) {
            localStorage.setItem(this.key, score);
          }
        }
      }

      const scoreAPI = new HighScoreAPI();

      highEl.textContent = scoreAPI.getHighScore();

      function resize() {
        canvas.width = innerWidth;
        canvas.height = innerHeight;
      }

      resize();

      addEventListener("resize", resize);

      // ROAD
      const roadWidth = window.innerWidth * 0.65;

      const roadX = (window.innerWidth - roadWidth) / 2;

      const lanes = [
        roadX + roadWidth * 0.17,
        roadX + roadWidth * 0.5,
        roadX + roadWidth * 0.83,
      ];

      // PLAYER
      const player = {
        lane: 1,
        x: lanes[1],
        y: innerHeight - 140,
      };

      let playerColor = "#ff1744";

      // SKINS
      document.querySelectorAll(".skin").forEach((skin) => {
        skin.onclick = () => {
          document
            .querySelectorAll(".skin")
            .forEach((s) => s.classList.remove("active"));

          skin.classList.add("active");

          playerColor = skin.dataset.color;
        };
      });

      let obstacles = [];

      let score = 0;

      let level = 1;

      let speed = 7;

      let playing = false;

      let roadOffset = 0;

      function resetGame() {
        obstacles = [];

        score = 0;

        level = 1;

        speed = 7;

        player.lane = 1;

        player.x = lanes[1];
      }

      function startGame() {
        resetGame();

        overlay.style.display = "none";

        playing = true;
      }

      // CONTROLS
      function moveLeft() {
        if (player.lane > 0) player.lane--;
      }

      function moveRight() {
        if (player.lane < 2) player.lane++;
      }

      // KEYBOARD
      addEventListener("keydown", (e) => {
        if (!playing) return;

        if (e.key === "ArrowLeft" || e.key === "a") {
          moveLeft();
        }

        if (e.key === "ArrowRight" || e.key === "d") {
          moveRight();
        }
      });

      // TOUCH BUTTONS
      leftBtn.addEventListener("touchstart", moveLeft);

      rightBtn.addEventListener("touchstart", moveRight);

      // TOUCH SCREEN
      canvas.addEventListener("touchstart", (e) => {
        const x = e.touches[0].clientX;

        if (x < innerWidth / 2) {
          moveLeft();
        } else {
          moveRight();
        }
      });

      // CLICK
      canvas.addEventListener("click", (e) => {
        if (e.clientX < innerWidth / 2) {
          moveLeft();
        } else {
          moveRight();
        }
      });

      // ROAD
      function drawRoad() {
        ctx.fillStyle = "#14532d";

        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#2d2d2d";

        ctx.fillRect(roadX, 0, roadWidth, canvas.height);

        ctx.fillStyle = "#ffffff";

        ctx.fillRect(roadX - 6, 0, 6, canvas.height);

        ctx.fillRect(roadX + roadWidth, 0, 6, canvas.height);

        roadOffset += speed;

        for (let y = -40; y < canvas.height; y += 80) {
          ctx.fillRect(roadX + roadWidth / 3 - 4, y + (roadOffset % 80), 8, 42);

          ctx.fillRect(
            roadX + (roadWidth / 3) * 2 - 4,
            y + (roadOffset % 80),
            8,
            42,
          );
        }
      }

      // CAR
      function drawCar(x, y, color, enemy = false) {
        ctx.fillStyle = "rgba(0,0,0,0.25)";

        ctx.fillRect(x - 28, y + 6, 56, 100);

        ctx.fillStyle = color;

        ctx.beginPath();

        ctx.roundRect(x - 30, y, 60, 100, 14);

        ctx.fill();

        ctx.fillStyle = enemy ? "#222" : "#87ceeb";

        ctx.beginPath();

        ctx.roundRect(x - 22, y + 18, 44, 38, 10);

        ctx.fill();

        ctx.fillStyle = "#ffe066";

        ctx.fillRect(x - 24, y + 6, 10, 10);

        ctx.fillRect(x + 14, y + 6, 10, 10);

        ctx.fillStyle = "#111";

        ctx.fillRect(x - 36, y + 18, 8, 22);

        ctx.fillRect(x + 28, y + 18, 8, 22);

        ctx.fillRect(x - 36, y + 62, 8, 22);

        ctx.fillRect(x + 28, y + 62, 8, 22);
      }

      // SPAWN
      function spawnObstacle() {
        const lane = Math.floor(Math.random() * 3);

        obstacles.push({
          lane,
          x: lanes[lane],
          y: -140,
          color: `hsl(${Math.random() * 360},80%,55%)`,
        });
      }

      setInterval(() => {
        if (playing) {
          spawnObstacle();
        }
      }, 900);

      // GAME LOOP
      function animate() {
        requestAnimationFrame(animate);

        drawRoad();

        if (!playing) return;

        // SMOOTH MOVEMENT
        player.x += (lanes[player.lane] - player.x) * 0.18;

        drawCar(player.x, player.y, playerColor);

        // LEVEL SYSTEM
        level = Math.floor(score / 10) + 1;

        const levelSpeeds = {
          1: 7,
          2: 8,
          3: 9,
          4: 10,
          5: 11.5,
          6: 13,
          7: 14.5,
          8: 16,
          9: 18,
          10: 20,
        };

        speed = levelSpeeds[level] || 20 + (level - 10) * 1.5;

        scoreEl.textContent = score;

        levelEl.textContent = level;

        speedEl.textContent = speed.toFixed(1) + "x";

        // OBSTACLES
        obstacles.forEach((car, index) => {
          car.y += speed;

          drawCar(car.x, car.y, car.color, true);

          // COLLISION
          if (
            player.x - 28 < car.x + 28 &&
            player.x + 28 > car.x - 28 &&
            player.y < car.y + 100 &&
            player.y + 100 > car.y
          ) {
            playing = false;

            scoreAPI.saveScore(score);

            highEl.textContent = scoreAPI.getHighScore();

            overlay.innerHTML = `
                <h1>CRASHED</h1>

                <p>
                  Score: ${score}<br>
                  High Score:
                  ${scoreAPI.getHighScore()}
                </p>

                <button
                  class="start-btn"
                  onclick="location.reload()"
                >
                  PLAY AGAIN
                </button>
              `;

            overlay.style.display = "flex";
          }

          // REMOVE
          if (car.y > canvas.height + 120) {
            obstacles.splice(index, 1);

            score++;
          }
        });
      }

      animate();
    </script>
  </body>
</html>
